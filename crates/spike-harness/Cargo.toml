[package]
name = "spike-harness"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "SHOGUN Phase 0 measurement harness (spec §4). Carried into the real implementation."

[lib]
name = "spike_harness"
path = "src/lib.rs"

[[bin]]
name = "report"
path = "src/bin/report.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
twox-hash = { version = "1.6", default-features = false }

# macOS-only: self-process CPU sampling via task_info (spec §4.2.3).
# Gated so the crate resolves and unit-tests on Linux CI.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
mach2 = "0.4"

[lints]
workspace = true
