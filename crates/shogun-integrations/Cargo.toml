[package]
name = "shogun-integrations"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "SHOGUN first-layer connector adapter: maps the shogun-mcp scope table onto Google Workspace official remote MCP servers and carries the effectful transport (behind the `live` feature)."

# The pure layer — endpoint/scope tables, our-op→MCP-tool mapping, and MCP result normalization —
# compiles and tests on Linux with no network. The real HTTPS JSON-RPC client (reqwest) and the
# macOS Keychain token source live behind the `live` feature, exactly like shogun-core's `net`
# feature, so the pure-logic CI never pulls in a TLS stack.
[features]
default = []
live = ["dep:reqwest"]

[dependencies]
# The scope table + the IntegrationTransport seam this crate implements. One-way: integrations → mcp.
shogun-mcp = { path = "../shogun-mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `live`: a blocking HTTPS JSON-RPC client for the MCP Streamable-HTTP transport. rustls (no OpenSSL),
# matching shogun-core. Off by default.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"], optional = true }

# The macOS Keychain token source (invariant 7: secrets never in a file/DB/log). macOS-only and
# gated in code by `#[cfg(target_os = "macos")]`; other targets use the env/static token providers
# for dev + integration. Not tied to the `live` feature — it is just a token source, no network.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[lints]
workspace = true
