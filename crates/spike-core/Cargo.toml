[package]
name = "spike-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "SHOGUN Phase 0 spike behavioural logic — pure, platform-independent, unit-tested."

# Deliberately dependency-free and macOS-free so the state machine / geometry / hover
# judgement can be exhaustively tested on Linux CI. The macOS shell (apps/desktop/src-tauri)
# is a thin adapter that feeds OS events in and applies the emitted effects. This keeps the
# risky Q2 (expand) / Q4 (false-positive) logic verifiable off-device.
#
# NOTE (dev-instructions §5.7): the spike is throwaway and "don't build product foundation"
# applies. This crate exists ONLY because the four questions can't be answered without a
# correct state machine + hit-region math, and those must be tested — which the macOS crate
# can't be on Linux. It is spike code, not the real implementation's core.

[lib]
name = "spike_core"
path = "src/lib.rs"

[lints]
workspace = true
