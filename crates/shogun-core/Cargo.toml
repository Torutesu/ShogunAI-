[package]
name = "shogun-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "SHOGUN core: pure, platform-independent behavioural logic (notch UI + capture policy)."

# The daemon-side core (spec §5.1): notch behaviour + capture policy + SLO metrics + the
# internal event bus. The `notch` / `capture` / `metrics` modules stay macOS-free and
# dependency-light so they are exhaustively unit-testable on Linux CI (carried forward from the
# Phase 0 spike). The `bus` module adds tokio for the async broadcast; it too runs under Linux
# tests. Makes no process-boundary assumptions (AR-03) so a later daemon split is an
# architecture no-op.

[lib]
name = "shogun_core"
path = "src/lib.rs"

[features]
default = []
# `net` pulls in the real HTTPS transport (reqwest). It is OFF by default so the pure-logic CI
# job (and every Linux unit test of request-building / parsing / traceability) compiles without
# reqwest; the macOS shell enables it.
net = ["dep:reqwest"]
# `db` pulls in the storage + fusion layers for the daemon's wiring (DB-backed traceability sink,
# capture writes, state reads → Fusion supply). OFF by default so the pure-logic tests stay
# rusqlite-free; the daemon (and its CI step) enable it.
db = ["dep:shogun-memory", "dep:rusqlite", "dep:shogun-fusion", "dep:shogun-mcp"]

[dependencies]
tokio = { version = "1", features = ["sync"] }
thiserror = "1"
serde_json = "1"
twox-hash = "1"
# Real HTTPS transport, feature-gated. rustls only (no system OpenSSL); certificate verification
# is never disabled (NFR-SEC-04).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
# Storage layer + its rusqlite handle, feature-gated (see the `db` feature). Same rusqlite version
# as shogun-memory so the bundled SQLite compiles once.
shogun-memory = { path = "../shogun-memory", optional = true }
shogun-fusion = { path = "../shogun-fusion", optional = true }
# The daemon implements the Memory API's data backend (dependency-inverted: the trait lives in mcp).
shogun-mcp = { path = "../shogun-mcp", optional = true }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true
