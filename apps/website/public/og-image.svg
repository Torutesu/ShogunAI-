<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ShogunAI — Your personal AGI on your PC.</title>
  <desc id="desc">Built to finish real work.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9ff"/>
      <stop offset="0.52" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f1e8"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7ba1ff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#7ba1ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e4c27b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e4c27b" stop-opacity="0"/>
    </radialGradient>
    <filter id="markShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#004cfc" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1020" cy="84" r="360" fill="url(#blueGlow)"/>
  <circle cx="220" cy="660" r="390" fill="url(#goldGlow)"/>

  <g transform="translate(80 68)">
    <g transform="scale(.045)" fill="#004CFC">
      <path d="M296 254 L469 0 L469 525 Z"/>
      <path d="M0 101 L276 264 L446 524 L176 390 Z"/>
      <path d="M62 613 L171 413 L331 493 Z"/>
      <g transform="translate(957,0) scale(-1,1)">
        <path d="M296 254 L469 0 L469 525 Z"/>
        <path d="M0 101 L276 264 L446 524 L176 390 Z"/>
        <path d="M62 613 L171 413 L331 493 Z"/>
      </g>
    </g>
    <text x="58" y="31" fill="#0b1738" font-family="Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-1">ShogunAI</text>
  </g>

  <g transform="translate(916 82) scale(.18)" fill="#004CFC" filter="url(#markShadow)">
    <path d="M296 254 L469 0 L469 525 Z"/>
    <path d="M0 101 L276 264 L446 524 L176 390 Z"/>
    <path d="M62 613 L171 413 L331 493 Z"/>
    <g transform="translate(957,0) scale(-1,1)">
      <path d="M296 254 L469 0 L469 525 Z"/>
      <path d="M0 101 L276 264 L446 524 L176 390 Z"/>
      <path d="M62 613 L171 413 L331 493 Z"/>
    </g>
  </g>

  <text x="80" y="310" fill="#0b1738" font-family="Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-2.8">Your personal AGI on your PC.</text>
  <text x="80" y="390" fill="#004cfc" font-family="Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-2.8">Built to finish real work.</text>

  <line x1="80" y1="510" x2="1120" y2="510" stroke="#b9c8ee" stroke-opacity="0.65"/>
  <text x="80" y="552" fill="#455676" font-family="Arial, sans-serif" font-size="20" font-weight="600">On your machine. On your own plan.</text>
  <text x="1120" y="552" fill="#64718a" font-family="Arial, sans-serif" font-size="20" text-anchor="end">shogunaios.com</text>
