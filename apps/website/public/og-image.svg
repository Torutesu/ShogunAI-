<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ShogunAI - Your AI has memory. Now it acts.</title>
  <desc id="desc">One memory across every tool. Private by default.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dce5ff"/>
      <stop offset=".46" stop-color="#f4f7ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="cloud" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#004cfc" flood-opacity=".2"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <circle cx="1040" cy="-20" r="350" fill="url(#cloud)"/>
  <circle cx="-60" cy="635" r="310" fill="url(#cloud)" opacity=".72"/>
  <g transform="translate(945 76) scale(.18)" fill="#004CFC" filter="url(#shadow)">
    <path d="M296 254 L469 0 L469 525 Z"/>
    <path d="M0 101 L276 264 L446 524 L176 390 Z"/>
    <path d="M62 613 L171 413 L331 493 Z"/>
    <g transform="translate(957,0) scale(-1,1)">
