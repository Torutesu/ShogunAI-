      <path d="M0 101 L276 264 L446 524 L176 390 Z"/>
      <path d="M62 613 L171 413 L331 493 Z"/>
    </g>
  </g>
  <text x="80" y="275" fill="#0b1b43" font-family="Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-4">Your AI has memory.</text>
  <text x="80" y="352" fill="#004cfc" font-family="Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-4">Now it acts.</text>
  <text x="83" y="409" fill="#536a9e" font-family="Arial, sans-serif" font-size="27">One memory across every tool. Private by default.</text>
  <g transform="translate(80 475)">
