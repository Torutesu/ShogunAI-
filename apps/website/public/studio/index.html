<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>ShogunAI — Demo Studio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #0b1220; --muted: #5f6b73; --line: rgba(255,255,255,.14);
    --panel: rgba(252,253,255,.92); --accent: #004cfc; --live: #30d158; --warn: #ff9f0a;
    --sys: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  html, body { height: 100%; background: #0a0c12; font-family: var(--sys); }
  body { display: grid; place-items: center; overflow: hidden; }

  /* ---------- Mac ---------- */
  .mac { width: min(94vw, 1560px, calc((100vh - 150px) * 1.6)); }
  .lid { border-radius: 26px; padding: 10px; background: linear-gradient(180deg,#dfe1e5,#b6b9c0); box-shadow: 0 60px 120px rgba(0,0,0,.55); }
  .bezel { position: relative; border-radius: 18px; padding: 12px; background: #08080a; }
  .screen { position: relative; overflow: hidden; border-radius: 8px; aspect-ratio: 16/10;
    background:
      radial-gradient(120% 90% at 50% -10%, #6a7fc4 0%, #3a4a86 38%, #1d2547 70%, #12172c 100%); }
  .notch { position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: 190px; height: 26px; background: #08080a; border-radius: 0 0 14px 14px; z-index: 40; }
  .base { width: 88%; height: 14px; margin: 0 auto; border-radius: 0 0 12px 12px; background: linear-gradient(180deg,#c8cbd1,#93989f); }
  .foot { width: 26%; height: 6px; margin: 0 auto; border-radius: 0 0 8px 8px; background: #82878f; }

  /* ---------- macOS chrome ---------- */
  .menubar { position: absolute; inset: 0 0 auto 0; height: 26px; z-index: 30; display: flex; align-items: center;
    gap: 18px; padding: 0 14px; color: #fff; font-size: 12px; background: rgba(0,0,0,.22); backdrop-filter: blur(12px); }
  .menubar .grow { flex: 1; }
  .menubar b { font-weight: 700; }
  .menubar span { opacity: .85; }
  .dock { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 30; display: flex; gap: 10px;
    padding: 8px 12px; border-radius: 18px; background: rgba(255,255,255,.16); backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,.22); }
  .dock i { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; font-size: 17px; font-style: normal;
    background: linear-gradient(180deg,#fff,#e6e9f2); box-shadow: 0 6px 14px rgba(0,0,0,.25); }
  .dock i.on { outline: 2px solid rgba(255,255,255,.75); }

  /* ---------- window ---------- */
  .win { position: absolute; left: 5%; bottom: 12%; width: 42%; border-radius: 12px; overflow: hidden; z-index: 10;
    background: #fff; box-shadow: 0 30px 70px rgba(0,0,0,.4); opacity: 0; transform: translateY(14px) scale(.98);
    transition: opacity .45s ease, transform .45s ease; }
  .win.show { opacity: 1; transform: none; }
  .win .bar { display: flex; align-items: center; gap: 7px; padding: 9px 12px; background: #f1f2f5; border-bottom: 1px solid #e2e4e9; }
  .win .bar u { width: 11px; height: 11px; border-radius: 50%; display: block; }
  .win .bar .t { flex: 1; text-align: center; font-size: 11.5px; color: #6b7280; }
  .win .body { padding: 18px 20px; min-height: 250px; font-size: 13.5px; line-height: 1.85; color: #111827; }
  .win .to { color: #6b7280; font-size: 12px; border-bottom: 1px solid #eef0f4; padding-bottom: 8px; margin-bottom: 12px; }
  .caret { display: inline-block; width: 1.5px; height: 1.05em; background: #111827; vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- ShogunAI panel ---------- */
  .panel { position: absolute; left: 50%; top: 26px; transform: translateX(-50%); width: 54%; z-index: 35;
    border-radius: 0 0 20px 20px; background: var(--panel); backdrop-filter: blur(28px) saturate(160%);
    box-shadow: 0 26px 60px rgba(6,12,32,.35); border: 1px solid rgba(255,255,255,.6); border-top: 0; color: var(--ink);
    transition: width .4s ease; }
  .p-head { display: flex; align-items: center; gap: 8px; padding: 9px 14px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; background: rgba(11,18,32,.06); font-size: 11px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); box-shadow: 0 0 9px var(--live); }
  .p-head .grow { flex: 1; }
  .chip { font-size: 10.5px; padding: 3px 8px; border-radius: 999px; background: rgba(0,76,252,.1); color: var(--accent); font-weight: 700; }
  .p-body { padding: 0 14px 14px; }
  .ask { display: flex; align-items: center; gap: 9px; padding: 10px 12px; border-radius: 13px; background: rgba(11,18,32,.05); font-size: 13px; }
  .ask .q { flex: 1; color: var(--ink); }
  .ask .q.ph { color: #9aa3af; }
  .kbd { font-family: var(--mono); font-size: 10.5px; padding: 2px 6px; border-radius: 6px; background: rgba(11,18,32,.08); color: var(--muted); }
  .out { margin-top: 10px; font-size: 13px; line-height: 1.8; }
  .out .lead { font-weight: 600; }
  .row { display: flex; align-items: flex-start; gap: 9px; padding: 8px 10px; border-radius: 11px; background: rgba(255,255,255,.7);
    border: 1px solid rgba(11,18,32,.07); margin-top: 7px; font-size: 12.5px; opacity: 0; transform: translateY(6px);
    transition: opacity .35s ease, transform .35s ease; }
  .row.show { opacity: 1; transform: none; }
  .row .lv { font-size: 9.5px; font-weight: 800; padding: 2px 6px; border-radius: 6px; flex: none; }
  .lv1 { background: rgba(48,209,88,.16); color: #17803d; }
  .lv2 { background: rgba(0,76,252,.12); color: var(--accent); }
  .lv3 { background: rgba(255,159,10,.18); color: #9a6200; }
  .row .g { flex: 1; }
  .src { color: var(--muted); font-size: 11px; margin-top: 3px; }
  .gate { margin-top: 9px; padding: 10px 12px; border-radius: 12px; border: 1px dashed rgba(255,159,10,.6); background: rgba(255,159,10,.08); font-size: 12.5px; }
  .gate b { color: #9a6200; }
  .btns { display: flex; gap: 7px; margin-top: 9px; }
  .btn { font-size: 12px; font-weight: 700; padding: 7px 13px; border-radius: 999px; border: 0; cursor: pointer; font-family: var(--sys); }
  .btn.p { background: var(--ink); color: #fff; }
  .btn.s { background: rgba(11,18,32,.07); color: var(--ink); }
  .ok { color: #17803d; font-weight: 700; }
  .trace { margin-top: 10px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); line-height: 1.7; }

  /* ---------- meeting ---------- */
  .meet { position: absolute; right: 5%; bottom: 12%; width: 34%; z-index: 20; border-radius: 16px; overflow: hidden;
    background: rgba(14,18,32,.9); backdrop-filter: blur(20px); color: #e8ecf6; box-shadow: 0 30px 70px rgba(0,0,0,.45);
    opacity: 0; transform: translateY(14px); transition: opacity .45s ease, transform .45s ease; }
  .meet.show { opacity: 1; transform: none; }
  .meet h4 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #9db2ff; padding: 12px 14px 0; }
  .meet .lines { padding: 8px 14px 4px; font-size: 12.5px; line-height: 1.8; min-height: 92px; }
  .meet .lines p { opacity: 0; transform: translateY(5px); transition: .3s; }
  .meet .lines p.show { opacity: 1; transform: none; }
  .meet .mins { padding: 4px 14px 14px; font-size: 12.5px; line-height: 1.8; }
  .meet .mins ul { list-style: none; margin-top: 5px; }
  .meet .mins li { padding-left: 15px; position: relative; }
  .meet .mins li::before { content: "✓"; position: absolute; left: 0; color: #87e5b4; }
  .meet .foot2 { padding: 0 14px 12px; font-size: 10.5px; color: #8d97ad; }

  /* ---------- controls ---------- */
  .ctl { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center;
    background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 7px 10px; z-index: 100;
    backdrop-filter: blur(10px); transition: opacity .3s; }
  .ctl.hide { opacity: 0; pointer-events: none; }
  .ctl button { font: inherit; font-size: 12px; font-weight: 700; color: #fff; background: rgba(255,255,255,.14);
    border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .ctl button:hover { background: rgba(255,255,255,.26); }
  .ctl .step { color: #aab2c5; font-size: 11px; font-family: var(--mono); padding: 0 4px; }
  .hint { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); color: #93a0bb; font-size: 11.5px; z-index: 100; transition: opacity .3s; }
  .hint.hide { opacity: 0; }
</style>
</head>
<body>
<div class="mac">
  <div class="lid">
    <div class="bezel">
      <div class="screen" id="screen">
        <div class="notch"></div>
        <div class="menubar">
          <b>ShogunAI</b><span>ファイル</span><span>編集</span><span>表示</span>
          <span class="grow"></span><span id="clock">9:41</span>
        </div>

        <div class="win" id="win">
          <div class="bar"><u style="background:#ff5f57"></u><u style="background:#febc2e"></u><u style="background:#28c840"></u><div class="t" id="winTitle">新規メッセージ</div></div>
          <div class="body">
            <div class="to" id="winTo">宛先: beta@shogunaios.com　件名: v1.0 リリースのご案内</div>
            <div id="winText"></div><span class="caret" id="caret"></span>
          </div>
        </div>

        <div class="panel" id="panel">
          <div class="p-head">
            <span class="pill"><i class="dot"></i><span id="statusText">Mail を読み取り中</span></span>
            <span class="grow"></span>
            <span class="chip" id="chip">ローカル</span>
          </div>
          <div class="p-body">
            <div class="ask"><span class="q ph" id="q">ShogunAI に聞く…</span><span class="kbd">⌥</span></div>
            <div class="out" id="out"></div>
          </div>
        </div>

        <div class="meet" id="meet">
          <h4 id="meetHead">文字起こし中</h4>
          <div class="lines" id="meetLines"></div>
          <div class="mins" id="meetMins"></div>
          <div class="foot2">音声はディスクに書きません。残るのはテキストだけです。</div>
        </div>

        <div class="dock">
          <i>✉️</i><i>📅</i><i>💬</i><i class="on">⚔</i><i>🗂️</i>
        </div>
      </div>
    </div>
  </div>
  <div class="base"></div>
  <div class="foot"></div>
</div>

<div class="hint" id="hint">Space / → で次へ　·　R でリセット　·　H でこのUIを隠す（録画用）</div>
<div class="ctl" id="ctl">
  <button id="prev">←</button>
  <span class="step" id="stepLabel">0 / 0</span>
  <button id="next">次へ →</button>
  <button id="auto">自動再生</button>
  <button id="reset">リセット</button>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const q = $('q'), out = $('out'), win = $('win'), winText = $('winText'), caret = $('caret');
  const meet = $('meet'), meetLines = $('meetLines'), meetMins = $('meetMins'), meetHead = $('meetHead');
  const statusText = $('statusText'), chip = $('chip');

  let timers = [];
  const after = (ms, fn) => timers.push(setTimeout(fn, ms));
  const clearAll = () => { timers.forEach(clearTimeout); timers = []; };

  function typeInto(el, text, speed, done, animate) {
    if (animate === false) { el.textContent = text; if (done) done(); return; }
    el.textContent = '';
    let i = 0;
    const tick = () => {
      el.textContent = text.slice(0, ++i);
      if (i < text.length) after(speed, tick); else if (done) after(180, done);
    };
    after(speed, tick);
  }

  function rows(html, animate) {
    out.innerHTML = html;
    if (animate === false) { out.querySelectorAll('.row').forEach((r) => r.classList.add('show')); return; }
    requestAnimationFrame(() => out.querySelectorAll('.row').forEach((r, i) => after(90 * i, () => r.classList.add('show'))));
  }

  // ---- the script ----
  const steps = [
    { // 0 — idle desktop
      run() {
        q.className = 'q ph'; q.textContent = 'ShogunAI に聞く…'; out.innerHTML = '';
        statusText.textContent = 'Mail を読み取り中'; chip.textContent = 'ローカル';
        win.classList.remove('show'); meet.classList.remove('show');
        winText.textContent = ''; caret.style.display = 'none';
      },
    },
    { // 1 — ask about the release
      run(a) {
        q.className = 'q';
        typeInto(q, '明日の v1.0 リリースで、まだ開いているものは?', 34, () => {
          statusText.textContent = '記憶を検索中';
          after(420, () => rows(`
            <div class="lead">開いているループが3件あります。</div>
            <div class="row"><span class="lv lv3">L3</span><span class="g">ベータ 519 名への告知メールが未送信<div class="src">火 14:20 · ローンチ計画 / Slack #launch</div></span></div>
            <div class="row"><span class="lv lv2">L2</span><span class="g">リリースノートが v3 の数字のまま未更新<div class="src">水 09:05 · 設計ドキュメント</div></span></div>
            <div class="row"><span class="lv lv1">L1</span><span class="g">Product Hunt の掲載素材が未整理<div class="src">木 18:40 · Notion</div></span></div>`, a));
        }, a);
      },
    },
    { // 2 — L1 runs by itself
      run(a) {
        statusText.textContent = 'L1 を実行中';
        rows(out.innerHTML, a);
        const add = () => {
          out.insertAdjacentHTML('beforeend',
            `<div class="row show" style="background:rgba(48,209,88,.09);border-color:rgba(48,209,88,.35)"><span class="lv lv1">L1</span><span class="g"><span class="ok">整理しました</span> — 掲載素材を1つのフォルダにまとめ、開いたループを閉じました<div class="src">取り消せてローカルに閉じた処理は、そのまま実行されます</div></span></div>`);
        };
        if (a === false) add(); else after(300, add);
      },
    },
    { // 3 — Option key draft
      run(a) {
        win.classList.add('show'); caret.style.display = 'inline-block';
        statusText.textContent = 'キャレットに書き込み中'; chip.textContent = '⌥ インライン下書き';
        const write = () => typeInto(winText,
          '明日 v1.0 をリリースします。火曜に決めたとおり7日間のフルトライアルはそのまま、チームプランはローンチから外しました。変更点はリリースノートの2ページ目にまとめています。',
          22, null, a);
        if (a === false) write(); else after(700, write);
      },
    },
    { // 4 — L3 stops at the gate
      run() {
        statusText.textContent = '承認待ち'; chip.textContent = 'L3 ゲート';
        out.insertAdjacentHTML('beforeend',
          `<div class="gate"><b>この操作は端末を出ます。</b><br>ベータ 519 名へ告知メールを送信します。<div class="btns"><button class="btn p" id="approve">承認して送信</button><button class="btn s" id="later">あとで</button></div></div>`);
        const ap = $('approve');
        if (ap) ap.onclick = () => next();
        const lt = $('later');
        if (lt) lt.onclick = () => next();
      },
    },
    { // 5 — approved + traceability
      run() {
        statusText.textContent = '送信しました'; chip.textContent = 'トレース記録済み';
        const g = out.querySelector('.gate');
        if (g) g.innerHTML = `<span class="ok">送信済み</span> — ベータ 519 名へ告知メールを送信しました。
          <div class="trace">09:41  direct   send_email      519 recipients   sha256:4f9c…a12b   1.2 KB<br>09:41  direct   draft_release   your provider  sha256:9b21…7e04  18 KB</div>`;
      },
    },
    { // 6 — meeting starts
      run(a) {
        win.classList.remove('show');
        meet.classList.add('show'); meetHead.textContent = '文字起こし中';
        meetMins.innerHTML = '';
        statusText.textContent = '会議を検知しました'; chip.textContent = '音声は保存しない';
        const lines = [
          'ローンチは明日の朝9時で確定。',
          '価格は Standard $49 / Pro $99 のまま。',
          'チームプランはローンチ後に判断する。',
        ];
        meetLines.innerHTML = lines.map((l) => `<p>${l}</p>`).join('');
        meetLines.querySelectorAll('p').forEach((el, i) => {
          if (a === false) el.classList.add('show');
          else after(700 * (i + 1), () => el.classList.add('show'));
        });
      },
    },
    { // 7 — minutes
      run() {
        meetHead.textContent = '議事録';
        statusText.textContent = '議事録を作成しました';
        meetMins.innerHTML = `明日9時にローンチ。価格は据え置き。チームプランはローンチ後に再検討。
          <ul><li>ミカ — 告知メールの結果を金曜に共有</li><li>リリースノートの2ページ目を最終確認</li></ul>`;
      },
    },
  ];

  let i = 0, auto = false, autoTimer = null;
  const stepLabel = $('stepLabel');

  function render() {
    clearAll();
    for (let k = 0; k <= i; k++) steps[k].run(k === i);
    stepLabel.textContent = i + ' / ' + (steps.length - 1);
  }
  function next() { if (i < steps.length - 1) { i++; render(); } else if (auto) { toggleAuto(); } }
  function prev() { if (i > 0) { i--; render(); } }
  function reset() { i = 0; render(); }
  function toggleAuto() {
    auto = !auto;
    $('auto').textContent = auto ? '停止' : '自動再生';
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
    if (auto) autoTimer = setInterval(next, 3800);
  }

  $('next').onclick = next; $('prev').onclick = prev; $('reset').onclick = reset; $('auto').onclick = toggleAuto;
  document.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft') prev();
    else if (e.key.toLowerCase() === 'r') reset();
    else if (e.key.toLowerCase() === 'a') toggleAuto();
    else if (e.key.toLowerCase() === 'h') { $('ctl').classList.toggle('hide'); $('hint').classList.toggle('hide'); }
  });

  // A fixed clock — a live one would change between takes.
  $('clock').textContent = '9:41';
  render();
})();
</script>
</body>
</html>
