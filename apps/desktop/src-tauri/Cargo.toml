[package]
name = "shogun-desktop-spike"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "SHOGUN Phase 0 notch-UI spike shell (throwaway; macOS/arm64 only)."

# This crate only builds on macOS/arm64 (Tauri + AppKit). On Linux CI it is a workspace
# member that resolves but is not built; `cargo test -p spike-harness` stays green.

[lib]
name = "shogun_desktop_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
# ⌘⇧Space global shortcut to open the notch panel without depending on hover.
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spike-harness = { path = "../../../crates/spike-harness" }
shogun-core = { path = "../../../crates/shogun-core" }
notify = "6.1"

# macOS FFI. Version-matched per research: objc2 CORE = 0.6.x, FRAMEWORK crates = 0.3.x
# (objc2-app-kit / objc2-foundation are already in the tree via tauri/wry). Only builds on
# macOS; excluded from the Linux resolution/build graph by the target cfg.
[target.'cfg(target_os = "macos")'.dependencies]
# The memory DB is only wired in on-device (capture_source persists through it). Enabling `db`
# here (not in the base [dependencies]) keeps rusqlite out of the Linux resolution graph.
# `net` adds the real HTTPS transport so the inline draft can call the BYOK Agent lane on device.
# `exec` (= db + net + agents) brings the send-execution path (send_exec + the HTTP clients) into
# the app without the standalone axum server, for the L3 approval → send wiring.
shogun-core = { path = "../../../crates/shogun-core", features = ["db", "net", "exec", "audio"] }
# BYOK key read from the macOS Keychain (invariant 7 — secrets never in a file/DB/log).
security-framework = "3"
# The DB encryption key type + the plaintext→encrypted upgrade path (memory at rest).
# `onnx` brings the local embedding model, which turns search from lexical into hybrid. The model
# files themselves are fetched separately (scripts/fetch-embedding-model.sh) and the app degrades
# to lexical search when they are absent.
shogun-memory = { path = "../../../crates/shogun-memory", features = ["onnx"] }
# OS CSPRNG for minting that key on first run — never a derived or guessable value.
getrandom = "0.2"
# A dedicated runtime to block the (async) Agent-lane call on the inline trigger thread. `time`
# is the Dream Cycle's inter-poll delay while a nightly batch is in flight.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
# shogun-fusion for the notch context-action command (ScreenContext / ActionCandidate / Level).
shogun-fusion = { path = "../../../crates/shogun-fusion" }
# shogun-agents for L1/L2/L3-gated execution of a clicked context action.
shogun-agents = { path = "../../../crates/shogun-agents" }
# First-layer connectors: OAuth+PKCE flow, Keychain token store, MCP transport, sync runtime.
# `live` for the effectful side (reqwest + Keychain). shogun-mcp for scope::from_source.
shogun-integrations = { path = "../../../crates/shogun-integrations", features = ["live"] }
shogun-mcp = { path = "../../../crates/shogun-mcp" }
# The turbo whisper model is fetched once over HTTPS on first use (model_fetch.rs). The HTTP egress
# itself lives in shogun-core (`model_asset::download_verified`, feature `net`) — FR-TR-03 keeps the
# one raw HTTP client in the traced egress crate, so the shell no longer depends on reqwest/sha2.
objc2 = "0.6"
block2 = "0.6" # ObjC blocks for NSWorkspace notification observers (space-change watcher)
objc2-app-kit = { version = "0.3", features = [
    "NSResponder", "NSWindow", "NSView", "NSPanel", "NSScreen",
    "NSWorkspace", "NSRunningApplication", "libc",
] }
objc2-foundation = { version = "0.3", features = [
    "NSString", "NSArray", "NSGeometry", "NSNotification",
] }
objc2-core-graphics = { version = "0.3", features = ["CGEvent", "CGEventTypes"] }
objc2-core-foundation = { version = "0.3", features = ["CFRunLoop", "CFMachPort", "CFBase"] }
accessibility-sys = "0.2"
# localtime_r for the zone offset: the Dream Cycle window is local wall-clock, and only the OS
# knows the offset actually in effect (DST included).
libc = "0.2"
core-foundation = "0.10"
core-foundation-sys = "0.8"

[lints]
workspace = true
