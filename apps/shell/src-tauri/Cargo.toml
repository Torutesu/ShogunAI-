[package]
name = "shogun-shell"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "SHOGUN Windows/Linux windowed shell. Not the macOS Notch app. No capture, no sqlcipher."

# Linux CI excludes this package (GTK/WebKit). Windows CI compiles it. Do not depend on
# shogun-core: that pulls openssl-src on MSVC.

[lib]
name = "shogun_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shogun-platform = { path = "../../../crates/shogun-platform" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_Foundation"] }

[lints]
workspace = true
