# SHOGUN Cargo workspace (Phase 0 spike).
# Integrated at the monorepo root alongside the pnpm workspace (docs/requirements-v1.0.md ADR-006).
# `crates/spike-harness` is the only asset carried into the real implementation (spec §2.1).
# `apps/desktop/src-tauri` is the throwaway spike shell and only builds on macOS/arm64.
[workspace]
resolver = "2"
members = [
    "crates/shogun-core",
    "crates/shogun-memory",
    "crates/shogun-fusion",
    "crates/shogun-agents",
    "crates/shogun-mcp",
    "crates/spike-harness",
    "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"
publish = false

# CLAUDE.md code rule: clippy warnings deny, no unwrap() outside tests.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
# SLO measurement must run on release builds only (spec §2.2).
debug = 1        # keep line tables for profiling the harness
lto = "thin"
codegen-units = 1
