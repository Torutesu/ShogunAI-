name: ci

# Four jobs: (1) pure crates (shogun-core + spike-harness) — platform-independent, tested
# and clippy-checked on Linux; (2) desktop frontend typecheck/build; (3) the macOS/arm64
# shell — compile + clippy only (the on-device MEASUREMENTS need a physical notch Mac);
# (4) the batch relay (apps/api) — the one process that holds the operator's Anthropic key.
# Phase 1 (docs/phase1-implementation-plan.md) grows the pure-crate job as shogun-core,
# shogun-memory, shogun-fusion, etc. come online — all covered by the workspace commands.

on:
  # Push only fires on the integration branch(es). Feature branches are validated by the
  # pull_request event instead — otherwise every commit on an open PR runs the whole matrix
  # twice (once for push, once for pull_request), which is where most of the CI noise came from.
  push:
    branches:
      - "main"
      - "master"
      - "claude/shogunai-ui-lp-lisvsd" # legacy default until `main` is promoted
    paths:
      - "crates/**"
      - "apps/desktop/**"
      - "apps/api/**"
      - "packages/**"
      - "scripts/**"
      - "Cargo.toml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "crates/**"
      - "apps/desktop/**"
      - "apps/api/**"
      - "packages/**"
      # The invariant guards live here. Without this filter a PR that weakens a guard — or the
      # workflow that runs it — is the one PR that never gets checked by it.
      - "scripts/**"
      - "Cargo.toml"
      - ".github/workflows/**"

# Supersede in-flight runs: a new push/PR-sync cancels the previous run for the same ref, so
# rapid pushes stop piling expensive (macos-14) jobs on top of each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: pure crates (clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # shogun-core + spike-harness are platform-independent; the macOS shell
      # (shogun-desktop-spike) only builds on-device, so it is excluded here.
      - name: clippy (warnings deny via workspace lints)
        run: cargo clippy --workspace --exclude shogun-desktop-spike --all-targets
      # The real HTTPS transport (shogun-core feature `net` → reqwest/rustls) is off by default so
      # the line above stays reqwest-free; verify it compiles+lints on its own.
      - name: clippy shogun-core net transport
        run: cargo clippy -p shogun-core --features net --all-targets
      # The DB-backed traceability sink (feature `db` → shogun-memory/rusqlite) is off by default
      # so the line above stays rusqlite-free; verify it compiles, lints, and its tests pass.
      - name: shogun-core db sink (clippy + test)
        run: |
          cargo clippy -p shogun-core --features db --all-targets
          cargo test -p shogun-core --features db
      # The REST listener (shogun-mcp feature `server` → axum) is off by default so the pure
      # routing layer tests without a runtime; verify the axum adapter compiles, lints, and its
      # over-the-socket tests pass.
      - name: shogun-mcp REST server (clippy + test)
        run: |
          cargo clippy -p shogun-mcp --features server --all-targets
          cargo test -p shogun-mcp --features server
      # The runnable `shogun-api` composition root (DB + backend + approval queue + axum) and the
      # end-to-end test that drives the real server with the CLI's loopback client.
      - name: shogun-api binary (clippy + e2e)
        run: |
          cargo clippy -p shogun-core --features daemon-server --all-targets
          cargo test -p shogun-core --features daemon-server --bin shogun-api
      # The MCP server face's stdio bin (only the storage layer, no axum).
      - name: shogun-mcp binary (clippy)
        run: cargo clippy -p shogun-core --features db --bin shogun-mcp
      - name: test
        run: cargo test --workspace --exclude shogun-desktop-spike
      # Invariant guards (each self-tests its detector, then checks the real tree/source):
      # - FR-TR-03: only the single traced egress (shogun-core) may depend on an HTTP/WS client.
      # - invariant 7: Secret::expose() only in allowlisted files (no raw-secret leak to log/DB).
      # - invariant 2: no image/audio bytes reach the filesystem (the DB + socket exceptions only).
      # - log rule: captured user text never reaches a log line (elog! or a shape, not the value).
      # - schema: migrations stay additive (memory lives for years; no DROP/RENAME/ALTER COLUMN).
      - name: invariant guards (egress / secrets / media / logs / migrations / batch filter)
        run: |
          python3 scripts/check-http-egress.py --self-test
          python3 scripts/check-http-egress.py
          python3 scripts/check-secret-exposure.py --self-test
          python3 scripts/check-secret-exposure.py
          python3 scripts/check-media-writes.py --self-test
          python3 scripts/check-media-writes.py
          python3 scripts/check-log-hygiene.py --self-test
          python3 scripts/check-log-hygiene.py
          python3 scripts/check-migrations.py --self-test
          python3 scripts/check-migrations.py
          python3 scripts/check-batch-source-filter.py --self-test
          python3 scripts/check-batch-source-filter.py
      - name: release build (SLO code path)
        run: cargo build -p spike-harness --release

  desktop-frontend:
    name: desktop frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # @shogun-ai/tokens' dist/ is generated (gitignored), so it does not exist after a clean
      # checkout. Build it before the desktop so any `@shogun-ai/tokens/css` import resolves on a
      # fresh runner (harmless if unused by the current entry).
      - run: pnpm --filter @shogun-ai/tokens build
      - run: pnpm --filter @shogun-ai/desktop typecheck
      # The real frontend gates (#119): ESLint with the React Hooks rules (rules-of-hooks is a
      # hard error; the Hooks-v6 analyses are warnings until #120/#122 clear the backlog), and
      # Vitest with Tauri IPC mocked at the module boundary — no live webview on a runner.
      - run: pnpm --filter @shogun-ai/desktop lint
      - run: pnpm --filter @shogun-ai/desktop test
      - run: pnpm --filter @shogun-ai/desktop build:vite

  api:
    name: batch relay (typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The relay holds the ONLY copy of the operator's Anthropic key (docs/batch-relay-design.md
      # §2.1), and its suite is where the licence verification, the batch-ownership check and the
      # spend cap are pinned. Before this job existed none of it ran anywhere.
      - run: pnpm --filter @shogun-ai/api typecheck
      - run: pnpm --filter @shogun-ai/api test

  macos-build:
    name: macOS shell (compile on Apple Silicon)
    # macos-14 is arm64 (Apple Silicon). Compile-only verification of the Tauri/AppKit
    # shell — the four-question MEASUREMENTS still require a physical notch Mac + human.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Generated (gitignored) token CSS the desktop entry may import — see the desktop-frontend job.
      - run: pnpm --filter @shogun-ai/tokens build
      # tauri's generate_context! needs the frontend dist to exist at compile time.
      - run: pnpm --filter @shogun-ai/desktop build:vite
      - name: clippy the macOS shell (warnings deny via workspace lints)
        run: cargo clippy -p shogun-desktop-spike --all-targets
