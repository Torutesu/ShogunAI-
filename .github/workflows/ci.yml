name: ci

# Three jobs: (1) pure crates (shogun-core + spike-harness) — platform-independent, tested
# and clippy-checked on Linux; (2) desktop frontend typecheck/build; (3) the macOS/arm64
# shell — compile + clippy only (the on-device MEASUREMENTS need a physical notch Mac).
# Phase 1 (docs/phase1-implementation-plan.md) grows the pure-crate job as shogun-core,
# shogun-memory, shogun-fusion, etc. come online — all covered by the workspace commands.

on:
  push:
    branches: ["**"]
    paths:
      - "crates/**"
      - "apps/desktop/**"
      - "Cargo.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "crates/**"
      - "apps/desktop/**"
      - "Cargo.toml"

jobs:
  rust:
    name: pure crates (clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # shogun-core + spike-harness are platform-independent; the macOS shell
      # (shogun-desktop-spike) only builds on-device, so it is excluded here.
      - name: clippy (warnings deny via workspace lints)
        run: cargo clippy --workspace --exclude shogun-desktop-spike --all-targets
      # The real HTTPS transport (shogun-core feature `net` → reqwest/rustls) is off by default so
      # the line above stays reqwest-free; verify it compiles+lints on its own.
      - name: clippy shogun-core net transport
        run: cargo clippy -p shogun-core --features net --all-targets
      - name: test
        run: cargo test --workspace --exclude shogun-desktop-spike
      # Invariant guards (each self-tests its detector, then checks the real tree/source):
      # - FR-TR-03: only the single traced egress (shogun-core) may depend on an HTTP client.
      # - invariant 7: Secret::expose() only in allowlisted files (no raw-secret leak to log/DB).
      # - schema: migrations stay additive (memory lives for years; no DROP/RENAME/ALTER COLUMN).
      - name: invariant guards (egress / secrets / migrations)
        run: |
          python3 scripts/check-http-egress.py --self-test
          python3 scripts/check-http-egress.py
          python3 scripts/check-secret-exposure.py --self-test
          python3 scripts/check-secret-exposure.py
          python3 scripts/check-migrations.py --self-test
          python3 scripts/check-migrations.py
      - name: release build (SLO code path)
        run: cargo build -p spike-harness --release

  desktop-frontend:
    name: desktop frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shogun-ai/desktop typecheck
      - run: pnpm --filter @shogun-ai/desktop build:vite

  macos-build:
    name: macOS shell (compile on Apple Silicon)
    # macos-14 is arm64 (Apple Silicon). Compile-only verification of the Tauri/AppKit
    # shell — the four-question MEASUREMENTS still require a physical notch Mac + human.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tauri's generate_context! needs the frontend dist to exist at compile time.
      - run: pnpm --filter @shogun-ai/desktop build:vite
      - name: clippy the macOS shell (warnings deny via workspace lints)
        run: cargo clippy -p shogun-desktop-spike --all-targets
