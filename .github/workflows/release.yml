name: release

# Signed + notarized macOS distribution build (Developer ID, App Store 不使用 — CLAUDE.md「課金/配布」).
# Produces a .dmg that Gatekeeper accepts when downloaded from the web (LP direct-download lane).
#
# Trigger:
#   - push a tag `v*` (e.g. v0.1.0) → build, sign, notarize, attach the DMG to a draft GitHub Release
#   - workflow_dispatch → same build, artifacts uploaded to the run (no Release created)
#
# Required repository secrets (setup runbook: docs/release-signing-and-distribution.md):
#   APPLE_CERTIFICATE             base64-encoded Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD    password of that .p12
#   APPLE_SIGNING_IDENTITY        e.g. "Developer ID Application: Taro Yamada (TEAMID1234)"
#   APPLE_TEAM_ID                 10-char team ID
# and ONE of the two notarization credential sets:
#   APPLE_ID + APPLE_PASSWORD                       Apple ID + app-specific password (simplest)
#   APPLE_API_ISSUER + APPLE_API_KEY + APPLE_API_KEY_CONTENT   App Store Connect API key (issuer id,
#                                                   key id, base64 .p8 content)
#
# Why the Apple steps are explicit here instead of delegated to the Tauri bundler:
#   - The bundler calls `notarytool ... --wait` with no timeout. This workflow's first run printed
#     "Notarizing …/SHOGUN Spike.app" and then sat there for 56 minutes until it was cancelled
#     (post-job cleanup killed an orphaned `notarytool`). `--wait --timeout 30m` bounds the Apple
#     round-trip, and a rejected submission prints its server-side log instead of a bare exit code.
#   - With notarization driven here, the DMG is built with `hdiutil` too: it keeps the disk image
#     out of the bundler's create-dmg/AppleScript path, and lets us sign, notarize and staple the
#     DMG as its own artifact.
#   - Signing material is imported into a keychain we own, so `codesign` still works in the later
#     steps (the bundler's throwaway keychain disappears with the bundler).
# No signing material ever touches the repo.
#
# Measured on the first green run (2026-08-09, cold cache): 11 min wall clock — 9 min build+sign,
# 54 s for both notarization round-trips, 2 s verification.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # create the draft release on tag builds

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: macOS arm64 (sign + notarize + dmg)
    # macos-14 is Apple Silicon — matches the app's only supported target (arm64, macOS 14+).
    runs-on: macos-14
    # A cold Rust build plus two Apple notarization round-trips runs ~35-50 min; anything past this
    # is a hang, and the default 6h job limit would burn a whole runner-hour budget before failing.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Fail fast with a readable message instead of a mid-build codesign/notarytool error.
      - name: preflight signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          missing=()
          [ -n "$APPLE_CERTIFICATE" ] || missing+=(APPLE_CERTIFICATE)
          [ -n "$APPLE_SIGNING_IDENTITY" ] || missing+=(APPLE_SIGNING_IDENTITY)
          [ -n "$APPLE_TEAM_ID" ] || missing+=(APPLE_TEAM_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing signing secrets: ${missing[*]} — see docs/release-signing-and-distribution.md"
            exit 1
          fi
          if { [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ]; } && \
             { [ -z "$APPLE_API_ISSUER" ] || [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_KEY_CONTENT" ]; }; then
            echo "::error::No notarization credentials: set APPLE_ID+APPLE_PASSWORD or APPLE_API_ISSUER+APPLE_API_KEY+APPLE_API_KEY_CONTENT"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Generated (gitignored) token CSS the desktop entry may import — same as ci.yml jobs.
      - run: pnpm --filter @shogun-ai/tokens build

      # On tag builds the tag is the version of record (v0.1.0 → 0.1.0); tauri.conf.json stays at
      # 0.0.0 in-repo. Patched in the checkout rather than passed as `tauri build --config`, because
      # pnpm claims `--config` for its own settings and would eat the flag before tauri sees it.
      - name: stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            const p = "apps/desktop/src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.version = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
          ' "$VERSION"

      # A keychain this job owns, so the identity is still resolvable by `codesign` in the DMG
      # steps below. Lives in RUNNER_TEMP (wiped with the runner) and is deleted in post.
      - name: import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/shogun-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # -lut 21600: no auto-lock inside the job's lifetime (a locked keychain fails codesign).
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a UI prompt that no one can answer on a runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          rm -f "$CERT_PATH"

          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          # Prove the identity resolves before spending 30 minutes compiling.
          security find-identity -v -p codesigning "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -qF "$APPLE_SIGNING_IDENTITY" || {
            echo "::error::APPLE_SIGNING_IDENTITY not found in the imported certificate — check the secret matches the .p12"
            exit 1
          }

      # Sign-only: no APPLE_ID/APPLE_PASSWORD here, so the bundler does not run its own
      # notarization pass (the explicit one below covers both the .app and the .dmg).
      - name: build + sign the app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # apps/desktop/README.md: a release build without this ships with analytics silently
          # disabled (issue #99). The value is a write-only PostHog project key, but it is still
          # sourced from a secret. Unset secret = empty = today's behaviour, so this is safe to
          # carry before the secret exists.
          SHOGUN_POSTHOG_KEY: ${{ secrets.SHOGUN_POSTHOG_KEY }}
        run: pnpm --filter @shogun-ai/desktop build

      - name: notarize app, build dmg, notarize dmg
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail

          APP="$(ls -d target/release/bundle/macos/*.app)"
          VERSION="$(node -p 'require("./apps/desktop/src-tauri/tauri.conf.json").version')"
          DMG_DIR="target/release/bundle/dmg"
          DMG="$DMG_DIR/ShogunAI-macOS-arm64-${VERSION}.dmg"
          mkdir -p "$DMG_DIR"
          echo "app=$APP  version=$VERSION"

          # --- notarization credentials: API key lane wins when present ---
          NOTARY=()
          if [ -n "${APPLE_API_KEY_CONTENT:-}" ]; then
            KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            echo "$APPLE_API_KEY_CONTENT" | base64 --decode > "$KEY_PATH"
            NOTARY=(--key "$KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
            echo "notarization lane: App Store Connect API key"
          else
            NOTARY=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
            echo "notarization lane: Apple ID + app-specific password"
          fi

          # Submit and wait, bounded. On rejection, print Apple's own log — the exit code alone
          # never says *which* binary or entitlement was the problem.
          notarize() {
            local artifact="$1" out id
            echo "--- notarytool submit: $artifact"
            if out="$(xcrun notarytool submit "$artifact" "${NOTARY[@]}" --wait --timeout 30m 2>&1)"; then
              echo "$out"
            else
              echo "$out"
              id="$(printf '%s\n' "$out" | awk '/^ *id: /{print $2; exit}')"
              if [ -n "$id" ]; then
                echo "--- notarytool log $id"
                xcrun notarytool log "$id" "${NOTARY[@]}" || true
              fi
              echo "::error::Notarization failed for $artifact"
              return 1
            fi
          }

          # 1) The .app itself, so the ticket travels with the app once dragged out of the DMG
          #    (a stapled app launches offline; an unstapled one needs a Gatekeeper round-trip).
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/app.zip"
          notarize "$RUNNER_TEMP/app.zip"
          xcrun stapler staple "$APP"

          # 2) DMG built from the now-stapled app. appdmg writes the window's .DS_Store directly,
          #    so the background image, icon size and icon positions survive without driving Finder
          #    over AppleScript (the thing that hangs headless runners). Coordinates are the ones
          #    the background art was drawn against — see apps/desktop/src-tauri/dmg/background.svg.
          cat > "$RUNNER_TEMP/appdmg.json" <<JSON
          {
            "title": "ShogunAI",
            "icon": "$GITHUB_WORKSPACE/apps/desktop/src-tauri/icons/icon.icns",
            "background": "$GITHUB_WORKSPACE/apps/desktop/src-tauri/dmg/background.png",
            "icon-size": 128,
            "window": { "size": { "width": 660, "height": 400 } },
            "format": "UDZO",
            "contents": [
              { "x": 175, "y": 190, "type": "file", "path": "$GITHUB_WORKSPACE/$APP" },
              { "x": 485, "y": 190, "type": "link", "path": "/Applications" }
            ]
          }
          JSON
          npx --yes appdmg@0.6.6 "$RUNNER_TEMP/appdmg.json" "$DMG"

          # 3) The DMG is its own distributable artifact: sign, notarize and staple it too, so
          #    Gatekeeper clears it at mount time without calling home.
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$DMG"
          notarize "$DMG"
          xcrun stapler staple "$DMG"

          echo "DMG_PATH=$DMG" >> "$GITHUB_ENV"

      # Prove what we're about to publish: valid Developer ID signature, Gatekeeper acceptance,
      # stapled tickets on both artifacts. A red X here beats a "damaged app" dialog on a user's Mac.
      - name: verify signature + notarization
        run: |
          set -euo pipefail
          APP="$(ls -d target/release/bundle/macos/*.app)"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=4 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|flags"
          spctl --assess --type exec --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature -v "$DMG_PATH"

      # The versioned DMG name changes every release; the LP wants one stable URL. Ship a
      # fixed-name copy alongside so the LP can hard-link
      # `releases/latest/download/ShogunAI-macOS-arm64.dmg` forever.
      - name: stable-name copy for the LP download link
        run: cp "$DMG_PATH" target/release/bundle/dmg/ShogunAI-macOS-arm64.dmg

      - name: upload artifacts (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: shogun-macos-arm64
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      # Draft so a human decides when the download URL goes live on the LP.
      - name: draft GitHub release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: target/release/bundle/dmg/*.dmg
          generate_release_notes: true

      - name: remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/shogun-signing.keychain-db" || true
