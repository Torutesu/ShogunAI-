name: Sync X snapshots (social points)

# Pulls follower/quote snapshots via the twscrape bridge and awards social
# points idempotently (spec §3.6). See apps/website/scripts/twscrape-bridge.md.
# Requires secrets: WORKER_URL (e.g. https://shogunai-website.x.workers.dev),
# ADMIN_TOKEN.
on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger X sync
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          # Token goes in a header, not the URL — a query-string secret can be
          # captured by edge/CDN access logs. -f fails the job on non-2xx.
          curl -fsS -X POST \
            -H "x-admin-token: ${ADMIN_TOKEN}" \
            "${WORKER_URL}/api/admin/sync-x" \
            | tee /dev/stderr
