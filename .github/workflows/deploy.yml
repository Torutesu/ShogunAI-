name: Deploy website (Cloudflare) — manual fallback

# NOTE: push-to-deploy is handled by Cloudflare's own Git integration
# (Workers Builds), which auto-builds every push to the connected branch with
#   Build:  pnpm --filter @shogun-ai/website cf:build
#   Deploy: pnpm --filter @shogun-ai/website exec wrangler deploy
# This workflow is a MANUAL fallback (Actions → Run workflow) for when you want
# to deploy from CI instead. Requires secrets CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID. Leave it manual so it can't double-deploy with CF.
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build OpenNext worker
        run: pnpm --filter @shogun-ai/website cf:build
      - name: Deploy to Cloudflare
        run: pnpm --filter @shogun-ai/website exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
