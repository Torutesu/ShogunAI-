name: Deploy website (Cloudflare)

# Push-to-deploy: builds the OpenNext Worker and deploys it to Cloudflare.
# Requires repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main, claude/shogunai-ui-lp-lisvsd]
    paths: ['apps/website/**', 'packages/**', 'pnpm-lock.yaml', '.github/workflows/deploy.yml']
  workflow_dispatch: {}

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build OpenNext worker
        run: pnpm --filter @shogun-ai/website cf:build
      - name: Deploy to Cloudflare
        run: pnpm --filter @shogun-ai/website exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
